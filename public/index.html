<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',

              800: '#3730a3',

            },
            mikrotik: {

              orange: '#f97316',

            mono: ['JetBrains Mono', 'monospace']

  <link rel="stylesheet" href="./style.css">

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

        <p class="text-sm font-medium tracking-wide text-slate-300">Loading MikroTik Hotspot SaaS Engine...</p>
